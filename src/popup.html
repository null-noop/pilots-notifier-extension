<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --google-blue: #1a73e8;
        --google-blue-hover: #1765cc;
        --google-text-primary: #202124;
        --google-text-secondary: #5f6368;
        --google-border: #dadce0;
        --google-bg: #ffffff;
        --google-input-bg: #ffffff;
        --google-success: #188038;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --google-blue: #8ab4f8;
          --google-blue-hover: #aecbfa;
          --google-text-primary: #e8eaed;
          --google-text-secondary: #9aa0a6;
          --google-border: #3c4043;
          --google-bg: #202124;
          --google-input-bg: #303134;
          --google-success: #81c995;
        }
      }

      body {
        font-family: 'Roboto', Arial, sans-serif;
        margin: 0;
        padding: 16px;
        width: 300px;
        background-color: var(--google-bg);
        color: var(--google-text-primary);
      }

      h2 {
        margin: 0 0 16px 0;
        font-size: 18px;
        font-weight: 400;
        color: var(--google-text-primary);
      }

      .field {
        margin-bottom: 16px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--google-text-secondary);
      }

      input {
        width: 100%;
        padding: 8px 12px;
        box-sizing: border-box;
        font-size: 13px;
        background-color: var(--google-input-bg);
        color: var(--google-text-primary);
        border: 1px solid var(--google-border);
        border-radius: 4px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      small {
        display: block;
        margin-top: 6px;
        color: var(--google-text-secondary);
        font-size: 11px;
        line-height: 1.4;
      }

      input:focus {
        border-color: var(--google-blue);
        box-shadow: 0 0 0 2px rgba(138, 180, 248, 0.2);
      }

      button {
        width: 100%;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        border: none;
        border-radius: 4px;
        background-color: var(--google-blue);
        color: #ffffff;
        transition: background-color 0.2s;
      }

      button:hover {
        background-color: var(--google-blue-hover);
      }

      button:active {
        filter: brightness(0.9);
      }

      #status {
        margin-top: 12px;
        color: var(--google-success);
        font-size: 12px;
        height: 14px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h2>Settings</h2>
    <div class="field">
      <label for="apiUrl">Notification server URL</label>
      <input type="url" id="apiUrl" placeholder="https://example.com" />
    </div>
    <div class="field">
      <label for="pairCode">Pairing code</label>
      <input
        type="text"
        id="pairCode"
        maxlength="19"
        autocomplete="off"
        spellcheck="false"
        placeholder="ABCD-EFGH-JKLM-NPQR"
      />
      <small>Private code from your server. Stored only in this browser.</small>
    </div>
    <button id="save">Save Settings</button>
    <div id="status"></div>
    <script src="../dist/popup.js"></script>
  </body>
</html>
